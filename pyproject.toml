[project]
name = "persona"
version = "0.1.0"
description = "A lightweight virtual-persona chat framework (delayed / interruptible replies, multi-route memory, affinity system)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
wechat = [
    "aiohttp>=3.9",
]
wechat-ui = [
    "pywinauto>=0.6",
    # pyweixin is not reliably on PyPI — install it yourself:
    #   pip install pyweixin        (if it works for you)
    # or clone github.com/Hello-Mr-Crab/pywechat and put its
    #   Mcp/pyweixin_rpa  on PYTHONPATH.  See docs/pywechat.md.
]

[project.scripts]
persona = "persona.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["persona"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
