[project]
name = "persona"
version = "0.1.0"
description = "A lightweight virtual-persona chat framework (delayed / interruptible replies, multi-route memory, affinity system)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
wechat = [
    "aiohttp>=3.9",
]
wechat-ui = [
    # pyweixin's runtime deps (pyweixin itself is vendored — see docs/pywechat.md,
    # its PyPI build is unusable). Windows only.
    "pywinauto>=0.6",
    "pyautogui>=0.9.54",
    "psutil>=5.9.5",
    "pycaw>=20240210",
    "comtypes>=1.2",
    "pywin32>=308",
    "pywin32-ctypes>=0.2.2",
    "packaging>=23.2",
    "emoji>=2.14.1",
    "soundfile>=0.12",
    "sounddevice>=0.5",
]

[project.scripts]
persona = "persona.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["persona"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
