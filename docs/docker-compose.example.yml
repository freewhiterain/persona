# Optional: run `persona wechat` next to WeChatPadPro.
#
# WeChatPadPro ships its OWN compose under its repo's deploy/ (MySQL + Redis +
# wechat_service). Bring that up first per its docs. This file only adds the
# persona side and assumes WeChatPadPro is reachable at wechatpadpro:1238.

services:
  persona:
    build: ..
    container_name: persona
    restart: unless-stopped
    working_dir: /app
    command: ["uv", "run", "persona", "wechat"]
    ports:
      - "9101:9101"                     # webhook target for WeChatPadPro
    environment:
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1   # local Ollama
      - OPENAI_API_KEY=ollama
      - PERSONA_FAKE_LLM=0
      - WECHATPADPRO_TOKEN=${WECHATPADPRO_TOKEN}
    volumes:
      - ..:/app
      - ./persona-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # config.toml [wechatpadpro]:
    #   enabled = true
    #   base_url = "http://wechatpadpro:1238"   # or host IP if WeChatPadPro runs elsewhere
    #   self_wxid = "wxid_...."
    #   webhook_secret = "...."                 # from WeChatPadPro's webhook_config.json
    #
    # In WeChatPadPro's webhook_config.json set the callback URL to:
    #   http://persona:9101/wechat/callback     (or http://<this-host-ip>:9101/...)
