# Example: WeChatPadPro alongside `persona wechat`.
#
# Replace <wechatpadpro-image> with the image from the WeChatPadPro distro you
# chose, and align ports / env with ITS docs. This file is illustrative.

services:
  wechatpadpro:
    image: <wechatpadpro-image>          # TODO: e.g. ghcr.io/.../wechatpadpro:latest
    container_name: wechatpadpro
    restart: unless-stopped
    ports:
      - "8080:8080"                      # HTTP API (+ ws) — match config base_url
    volumes:
      - ./wpp-data:/app/data             # persist login session — TODO: correct path
    # environment:
    #   - SOME_ADMIN_KEY=...             # per that build's docs

  persona:
    build: ..
    container_name: persona
    restart: unless-stopped
    depends_on: [wechatpadpro]
    working_dir: /app
    command: ["uv", "run", "persona", "wechat"]
    environment:
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1   # local Ollama
      - OPENAI_API_KEY=ollama
      - PERSONA_FAKE_LLM=0
      - WECHATPADPRO_TOKEN=${WECHATPADPRO_TOKEN}
    volumes:
      - ..:/app
      - ./persona-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # config.toml [wechatpadpro]:
    #   enabled = true
    #   base_url = "http://wechatpadpro:8080"
    #   self_wxid = "wxid_...."
